<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">

<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #1a1a26;
    --border: #2a2a3d;
    --accent: #7c6bff;
    --accent2: #ff6b9d;
    --gold: #ffd700;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --success: #4ade80;
    --fail: #f87171;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Ambient background */
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: 
      radial-gradient(ellipse at 20% 20%, rgba(124,107,255,0.07) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(255,107,157,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    padding: 0 16px 80px;
  }

  /* Header */
  header {
    text-align: center;
    padding: 32px 0 24px;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tagline {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  .rules-hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    letter-spacing: 0.3px;
  }

  .day-badge {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 12px;
    color: var(--muted);
  }

  /* Progress bar */
  .progress-bar {
    display: flex;
    gap: 5px;
    margin: 20px 0;
    justify-content: center;
  }

  .progress-dot {
    width: 32px;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    transition: background 0.3s ease;
  }

  .progress-dot.used { background: var(--muted); }
  .progress-dot.current { background: var(--accent); }
  .progress-dot.won { background: var(--success); }

  /* Indices list */
  .indices-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }

  .indice-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    animation: slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .indice-card.new {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent)22, 0 4px 20px rgba(124,107,255,0.15);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .indice-label {
    font-size: 14px;
    color: var(--muted);
    font-weight: 400;
  }

  .indice-rank {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }

  .indice-rank span {
    font-size: 13px;
    color: var(--muted);
    font-weight: 400;
    font-family: 'DM Sans', sans-serif;
  }

  /* Tentatives section */
  .tentatives-label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    margin-top: 8px;
  }

  .tentatives-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }

  .tentative-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--fail);
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .tentative-item::before {
    content: '✗';
    font-size: 12px;
  }

  /* Input area */
  .input-area {
    position: relative;
    margin-top: 8px;
  }

  .country-input {
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .country-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,107,255,0.12);
  }

  .country-input::placeholder { color: var(--muted); }

  .autocomplete-list {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    max-height: 220px;
    overflow-y: auto;
    z-index: 100;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    display: none;
  }

  .autocomplete-list.open { display: block; }

  .autocomplete-item {
    padding: 12px 18px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.15s;
  }

  .autocomplete-item:hover, .autocomplete-item.active {
    background: var(--border);
  }

  .autocomplete-item.already-used {
    opacity: 0.4;
    cursor: not-allowed;
    text-decoration: line-through;
  }

  .flag-emoji { display: flex; align-items: center; }

  /* Submit button */
  .btn-submit {
    width: 100%;
    margin-top: 10px;
    padding: 16px;
    background: linear-gradient(135deg, var(--accent), #9b5de5);
    border: none;
    border-radius: 14px;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: white;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: opacity 0.2s, transform 0.1s;
  }

  .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-submit:active { transform: translateY(0); }
  .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-pass {
    width: 100%;
    margin-top: 8px;
    padding: 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }

  .btn-pass:hover { border-color: var(--muted); color: var(--text); }

  /* End screen */
  .end-screen {
    text-align: center;
    padding: 32px 0;
    animation: fadeIn 0.5s ease;
  }

  .end-flag {
    margin-bottom: 16px;
    display: flex;
    justify-content: center;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .end-flag img {
    width: 120px;
    height: 90px;
    border-radius: 8px;
    object-fit: cover;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .end-title {
    font-family: 'Syne', sans-serif;
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 4px;
  }

  .end-title.win { color: var(--success); }
  .end-title.lose { color: var(--fail); }

  .end-country {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    margin: 8px 0 4px;
  }

  .end-score {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 20px;
  }

  .emoji-score {
    font-size: 20px;
    letter-spacing: 3px;
    margin: 12px 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    display: inline-block;
  }

  .btn-share {
    display: inline-block;
    margin-top: 8px;
    padding: 14px 32px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-share:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-share.copied {
    border-color: var(--success);
    color: var(--success);
  }

  .next-day {
    margin-top: 24px;
    font-size: 13px;
    color: var(--muted);
  }

  .countdown {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-top: 4px;
  }

  /* Already played */
  .already-played {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    margin-bottom: 20px;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 80px 0;
    color: var(--muted);
  }

  /* Indice counter */
  .indice-counter {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .indice-card { position: relative; cursor: pointer; }

  .indice-sens {
    font-size: 11px;
    color: var(--accent);
    margin-top: 3px;
    font-style: italic;
  }

  .tooltip-bubble {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 0; right: 0;
    background: #2a2a3d;
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text);
    z-index: 200;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    pointer-events: none;
  }

  .tooltip-bubble.visible { display: block; }
  .tooltip-bubble::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 20px;
    border: 6px solid transparent;
    border-top-color: var(--accent);
  }


  .btn-rejouer {
    width: 100%;
    margin-top: 10px;
    padding: 14px;
    background: transparent;
    border: 1.5px solid var(--accent);
    border-radius: 14px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-rejouer:hover {
    background: var(--accent);
    color: white;
  }

</style>
</head>

function getToday() {
  return new Date().toISOString().slice(0, 10);
}

function getDayNumber() {
  const start = new Date('2025-01-01');
  const now = new Date();
  return Math.floor((now - start) / 86400000) + 1;
}

// ─── Seeded RNG (Mulberry32) ─────────────────────────────────────
function seededRng(seed) {
  let s = seed;
  return function() {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function seededShuffle(arr, rng) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getTodayData() {
  const seed = parseInt(getToday().split('-').join(''));
  const rng = seededRng(seed);

  // Pick 3 distinct countries
  const shuffledCountries = seededShuffle(PAYS_DATA, seededRng(seed));
  const todayCountries = shuffledCountries.slice(0, 3);

  // For each country, pick 8 random indices using a different seed offset
  return todayCountries.map((country, ci) => {
    const indiceRng = seededRng(seed + ci * 999);
    const shuffledIndices = seededShuffle(country.indices, indiceRng);
    return {
      ...country,
      indices: shuffledIndices.slice(0, 8)
    };
  });
}

}

function ordinal(n) {
  if (n === 1) return '1er';
  return n + 'e';
}

    return state;

function toggleTooltip(card) {
  const bubble = card.querySelector('.tooltip-bubble');
  if (!bubble) return;
  // Close all others
  document.querySelectorAll('.tooltip-bubble.visible').forEach(b => {
    if (b !== bubble) b.classList.remove('visible');
  });
  bubble.classList.toggle('visible');
}

function render() {
  document.getElementById('dayBadge').textContent = `Jour #${getDayNumber()}`;
  const app = document.getElementById('app');

  if (state.finished) {
    renderEnd(app);
    return;
  }

  const shownIndices = country.indices.slice(0, state.indiceIdx + 1);
  const usedCountries = state.tentatives.map(t => t.toLowerCase());

  app.innerHTML = `
    <div class="progress-bar">
      ${Array.from({length: MAX_INDICES}, (_, i) => {
        let cls = '';
        if (i < state.indiceIdx) cls = 'used';
        else if (i === state.indiceIdx) cls = 'current';
        return `<div class="progress-dot ${cls}"></div>`;
      }).join('')}
    </div>

    <div class="indice-counter">Indice ${state.indiceIdx + 1} / ${MAX_INDICES}</div>

    <div class="indices-list">
      ${shownIndices.map((ind, i) => `
        <div class="indice-card ${i === shownIndices.length - 1 ? 'new' : ''}" onclick="toggleTooltip(this)">

function buildEmojiScore() {
  const total = state.indiceIdx + 1;
  let squares = '';
  for (let i = 0; i < MAX_INDICES; i++) {
    if (i >= total && !state.won) { squares += '⬜'; continue; }
    if (i >= total) { squares += '⬜'; continue; }
    if (state.won && i === total - 1) { squares += '🟩'; continue; }
    if (state.tentatives[i] !== undefined) { squares += '🟥'; continue; }
    squares += '⬛';
  }
  return squares;
}

function renderEnd(app) {
  const flag = getFlagEmoji(country.iso);
  const indicesUsed = state.indiceIdx + 1;
  const emoji = buildEmojiScore();

  app.innerHTML = `
    <div class="end-screen">
      <div class="end-flag">${flag}</div>
      <div class="end-title ${state.won ? 'win' : 'lose'}">${state.won ? '🎉 Bravo !' : 'Raté…'}</div>
      <div class="end-country">${country.nom}</div>
      <div class="end-score">
        ${state.won
          ? `Trouvé en <strong>${indicesUsed} indice${indicesUsed > 1 ? 's' : ''}</strong>`
          : `Le pays était <strong>${country.nom}</strong>`}
      </div>
      <div class="emoji-score">${emoji}</div>
      <br>
      <button class="btn-share" id="btnShare">📋 Copier mon score</button>
      <button class="btn-rejouer" id="btnRejouer">🔀 Rejouer avec un nouveau pays</button>
      <div class="next-day">
        Prochain pays dans
        <div class="countdown" id="countdown">--:--:--</div>
      </div>
    </div>
  `;

  document.getElementById('btnRejouer').addEventListener('click', () => {
    startFreeGame();
  });

  document.getElementById('btnShare').addEventListener('click', () => {
    const text = `GéoRank #${getDayNumber()} ${state.won ? `${indicesUsed}/${MAX_INDICES}` : 'X/8'}\n${emoji}\njouer sur georank.fr`;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('btnShare');
      btn.textContent = '✓ Copié !';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '📋 Copier mon score';
        btn.classList.remove('copied');
      }, 2000);
    });
  });

  updateCountdown();
  setInterval(updateCountdown, 1000);
}

function updateCountdown() {
  const now = new Date();
  const tomorrow = new Date(now);
  tomorrow.setDate(tomorrow.getDate() + 1);
  tomorrow.setHours(0, 0, 0, 0);
  const diff = tomorrow - now;
  const h = String(Math.floor(diff / 3600000)).padStart(2, '0');
  const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
  const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
  const el = document.getElementById('countdown');
  if (el) el.textContent = `${h}:${m}:${s}`;
}

// ─── Autocomplete ────────────────────────────────────────────────
let selectedIdx = -1;
let currentSuggestions = [];

function setupInput(usedCountries) {
  const input = document.getElementById('countryInput');
  const list = document.getElementById('autocompleteList');
  const btnSubmit = document.getElementById('btnSubmit');
  const btnPass = document.getElementById('btnPass');
  let chosen = null;

  const allNames = PAYS_DATA.map(p => ({ nom: p.nom, iso: p.iso }));

  input.addEventListener('input', () => {
    const val = input.value.trim().toLowerCase();
    chosen = null;
    btnSubmit.disabled = true;
    selectedIdx = -1;

    if (val.length < 1) {
      list.classList.remove('open');
      currentSuggestions = [];
      return;
    }

    currentSuggestions = allNames.filter(p =>
      p.nom.toLowerCase().includes(val) ||
      p.nom.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').includes(val)
    ).slice(0, 8);

    if (currentSuggestions.length === 0) {
      list.classList.remove('open');
      return;
    }

    list.innerHTML = currentSuggestions.map((p, i) => {
      const used = usedCountries.includes(p.nom.toLowerCase());
      return `<div class="autocomplete-item ${used ? 'already-used' : ''}" data-idx="${i}">
        <span class="flag-emoji">${getFlagEmoji(p.iso)}</span>
        ${p.nom}
      </div>`;
    }).join('');
    list.classList.add('open');

    list.querySelectorAll('.autocomplete-item').forEach(item => {
      item.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const idx = parseInt(item.dataset.idx);
        const p = currentSuggestions[idx];
        if (usedCountries.includes(p.nom.toLowerCase())) return;
        chosen = p.nom;
        input.value = p.nom;
        list.classList.remove('open');
        btnSubmit.disabled = false;
      });
    });

    list.classList.add('open');
  });

  input.addEventListener('keydown', (e) => {
    const items = list.querySelectorAll('.autocomplete-item:not(.already-used)');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      selectedIdx = Math.min(selectedIdx + 1, items.length - 1);
      updateActive(items);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      selectedIdx = Math.max(selectedIdx - 1, 0);
      updateActive(items);
    } else if (e.key === 'Enter') {
      if (selectedIdx >= 0 && items[selectedIdx]) {
        items[selectedIdx].dispatchEvent(new MouseEvent('mousedown'));
      } else if (chosen) {
        btnSubmit.click();
      }
    } else if (e.key === 'Escape') {
      list.classList.remove('open');
    }
  });

  function updateActive(items) {
    items.forEach((item, i) => item.classList.toggle('active', i === selectedIdx));
    if (items[selectedIdx]) {
      const p = currentSuggestions.find(s => s.nom === items[selectedIdx].textContent.trim().replace(/^\S+\s/, ''));
      if (p) {
        chosen = p.nom;
        input.value = p.nom;
        btnSubmit.disabled = false;
      }
    }
  }

  document.addEventListener('click', (e) => {
    if (!list.contains(e.target) && e.target !== input) {
      list.classList.remove('open');
    }
  });

  btnSubmit.addEventListener('click', () => {
    if (!chosen) return;
    submit(chosen);
  });

  if (btnPass) {
    btnPass.addEventListener('click', () => {
      passIndice();
    });
  }

}

// ─── Game Logic ──────────────────────────────────────────────────
function submit(guess) {
  if (guess.toLowerCase() === country.nom.toLowerCase()) {
    state.won = true;
    state.finished = true;
    saveState(state);
    render();
    return;
  }

  state.tentatives.push(guess);

  if (state.tentatives.length >= MAX_INDICES || state.indiceIdx >= MAX_INDICES - 1) {
    state.finished = true;
    state.won = false;
    saveState(state);
    render();
    return;
  }

  state.indiceIdx++;
  saveState(state);
  render();
}

function passIndice() {
  if (state.indiceIdx >= MAX_INDICES - 1) {
    state.finished = true;
    state.won = false;
    saveState(state);
    render();
    return;
  }
  state.indiceIdx++;
  saveState(state);
  render();
}

// ─── Free Game ───────────────────────────────────────────────────
function startFreeGame() {
  // Pick a random country different from today's
  const todaySeed = parseInt(getToday().split('-').join(''));
  let idx;
  do {
    idx = Math.floor(Math.random() * PAYS_DATA.length);
  } while (PAYS_DATA[idx].nom === country.nom);

  const base = PAYS_DATA[idx];
  const indiceRng = seededRng(Math.floor(Math.random() * 999999));
  const shuffled = seededShuffle(base.indices, indiceRng);
  country = { ...base, indices: shuffled.slice(0, 8) };

  state = {
    indiceIdx: 0,
    tentatives: [],
    finished: false,
    won: false,
  };

  render();
}

// ─── Init ────────────────────────────────────────────────────────
function init() {
  const seed = parseInt(getToday().split('-').join(''));
  const rng = seededRng(seed);

  // Pick today's country
  const shuffledCountries = seededShuffle(PAYS_DATA, seededRng(seed));
  const base = shuffledCountries[0];

  // Pick 8 random indices for today
  const indiceRng = seededRng(seed + 42);
  const shuffledIndices = seededShuffle(base.indices, indiceRng);
  country = { ...base, indices: shuffledIndices.slice(0, 8) };

  const saved = loadState();
  if (saved) {
    state = saved;
  }

  render();
}

init();
